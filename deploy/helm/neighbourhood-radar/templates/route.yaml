{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "ol.name" . }}
  labels: {{- include "ol.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "ol.name" . }}
  port:
    targetPort: http
  tls: {{- toYaml .Values.route.tls | nindent 4 }}
{{- end }}
