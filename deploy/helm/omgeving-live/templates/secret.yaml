{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ol.name" . }}
  labels: {{- include "ol.labels" . | nindent 4 }}
type: Opaque
stringData:
  OL_NS_API_KEY: {{ .Values.secrets.OL_NS_API_KEY | quote }}
  OL_OPENSKY_CLIENT_ID: {{ .Values.secrets.OL_OPENSKY_CLIENT_ID | quote }}
  OL_OPENSKY_CLIENT_SECRET: {{ .Values.secrets.OL_OPENSKY_CLIENT_SECRET | quote }}
{{- end }}
