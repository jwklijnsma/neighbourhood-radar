# Neighbourhood Radar documentation - built with Zensical (https://zensical.org), same design as shift-mox
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs

[project]
site_name = "Neighbourhood Radar"
site_description = "One map with live Dutch open data around a point you choose: 112/P2000, traffic, bridges, transit, weather, water, air and more"
site_url = "https://jwklijnsma.github.io/neighbourhood-radar/docs/"
repo_url = "https://github.com/jwklijnsma/neighbourhood-radar"
repo_name = "jwklijnsma/neighbourhood-radar"
edit_uri = "edit/main/docs/"
copyright = "Neighbourhood Radar - Dutch open data"
nav = [
  { "Home" = "index.md" },
  { "Screenshots" = "screenshots.md" },
  { "Getting started" = [
    { "Run it" = "install.md" },
    { "Configuration" = "configuration.md" },
  ] },
  { "Layers" = "layers.md" },
  { "Reference" = [
    { "How it works" = "how-it-works.md" },
    { "API" = "api.md" },
    { "Tests" = "tests.md" },
    { "CI and releases" = "ci.md" },
    { "Caveats" = "caveats.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/radar"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "orange"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "orange"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
