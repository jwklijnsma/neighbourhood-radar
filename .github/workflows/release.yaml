name: release

# Every push to main that passes CI becomes a release:
#   1. work out the next version from the commit messages since the last v* tag
#   2. build and push a multi-arch image to GHCR (version, major.minor, latest, sha)
#   3. package the Helm chart with that version, push it to GHCR as OCI
#   4. create the tag + GitHub Release with generated notes and the chart attached
#
# Version bump (Conventional Commits, checked in subject and body):
#   "BREAKING CHANGE" or "type!:"  -> major
#   "feat:" / "feat(scope):"       -> minor
#   anything else                  -> patch
# First release ever is v0.1.0. Docs-only pushes don't release.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".env.example"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/screenshots.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: Override the version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        env:
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next="0.1.0"
            echo "No previous release, starting at v$next"
          else
            if [ -z "$(git rev-list "$last"..HEAD)" ]; then
              echo "No commits since $last, nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            log=$(git log --format='%s%n%b' "$last"..HEAD)
            bump="$BUMP_INPUT"
            if [ "$bump" = auto ]; then
              if grep -qE 'BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:' <<<"$log"; then bump=major
              elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then bump=minor
              else bump=patch; fi
            fi
            IFS=. read -r major minor patch <<<"${last#v}"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
            echo "$last -> v$next ($bump)"
          fi
          {
            echo "version=$next"
            echo "tag=v$next"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neighbourhood-radar
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Package chart with the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          helm package deploy/helm/neighbourhood-radar \
            --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push chart to GHCR (OCI)
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/$owner/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  release:
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.tgz
          append_body: true
          body: |
            ### Install

            ```bash
            docker run -p 8080:8080 ghcr.io/${{ github.repository_owner }}/neighbourhood-radar:${{ needs.version.outputs.version }}
            ```

            ```bash
            helm install neighbourhood-radar oci://ghcr.io/${{ github.repository_owner }}/charts/neighbourhood-radar --version ${{ needs.version.outputs.version }}
            ```
