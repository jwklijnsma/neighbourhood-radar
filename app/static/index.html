<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omgeving Live</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23e8590c'/%3E%3C/svg%3E">
</head>
<body>
  <aside id="panel">
    <header>
      <h1><span class="dot"></span>Omgeving Live</h1>
      <p class="sub">Klik op de kaart om een punt te kiezen.</p>
    </header>

    <section class="where">
      <div class="coords" id="coords">—</div>
      <button id="locate" type="button">Mijn locatie</button>
    </section>

    <section class="radius">
      <label for="radius">Straal <output id="radiusOut">5 km</output></label>
      <input id="radius" type="range" min="0.5" max="50" step="0.5" value="5">
    </section>

    <section>
      <h2>Lagen</h2>
      <ul id="layers"></ul>
    </section>

    <section class="nearby">
      <h2>Dichtbij <span id="nearCount" class="muted"></span></h2>
      <ol id="nearby"></ol>
    </section>

    <footer id="attrib" class="muted"></footer>
  </aside>
  <main id="map" aria-label="Kaart"></main>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
